name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# FIN-372: a single immutable source supplies both CI and local lint.
# Tiny gates preserve the existing required check names.
jobs:
  go-check:
    uses: fin-assist/go-ci/.github/workflows/shared-go.yml@5d470e78d4cea7cdb92f03acf71762a5eae228be # main
    with:
      revision: '5d470e78d4cea7cdb92f03acf71762a5eae228be'
      profile: library
    secrets:
      GO_MODULES_TOKEN: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}

  go:
    needs: go-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.go-check.result }}
    steps:
      - name: Require successful shared checks
        run: test "$RESULT" = success
  lint-check:
    uses: fin-assist/go-ci/.github/workflows/shared-lint.yml@5d470e78d4cea7cdb92f03acf71762a5eae228be # main
    with:
      revision: '5d470e78d4cea7cdb92f03acf71762a5eae228be'
    secrets:
      GO_MODULES_TOKEN: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}

  lint:
    needs: lint-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.lint-check.result }}
    steps:
      - name: Require successful shared checks
        run: test "$RESULT" = success
  api-check:
    uses: fin-assist/go-ci/.github/workflows/shared-api.yml@5d470e78d4cea7cdb92f03acf71762a5eae228be # main
    with:
      revision: '5d470e78d4cea7cdb92f03acf71762a5eae228be'
    secrets:
      GO_MODULES_TOKEN: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}

  api:
    needs: api-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.api-check.result }}
    steps:
      - name: Require successful shared checks
        run: test "$RESULT" = success
  migrations-check:
    if: github.event_name == 'pull_request'
    uses: fin-assist/go-ci/.github/workflows/shared-migrations.yml@5d470e78d4cea7cdb92f03acf71762a5eae228be # main
    with:
      revision: '5d470e78d4cea7cdb92f03acf71762a5eae228be'

  migrations:
    needs: migrations-check
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.migrations-check.result }}
    steps:
      - name: Require successful shared checks
        run: test "$RESULT" = success
