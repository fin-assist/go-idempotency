# A tag vX.Y.Z on main publishes a release (docs/releasing.md). The owner pushes the tag after
# the release PR is merged; this workflow checks it and creates the GitHub release with the
# notes of its CHANGELOG.md section. Services get the version through Renovate.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.4.1); never creates or moves a tag'
        required: true
        type: string

permissions:
  contents: write # the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Keep release tooling on main so manual recovery can operate on an older immutable tag.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Save the release tooling
        run: cp scripts/publish-release.py scripts/validate-release.sh "$RUNNER_TEMP/"
      - name: Validate the requested tag
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "$TAG is not vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: The tag is a release of this module
        run: bash "$RUNNER_TEMP/validate-release.sh" "$TAG"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/publish-release.py" "$TAG" notes.md --repo "$GITHUB_REPOSITORY"
