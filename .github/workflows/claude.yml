# Claude Code in PRs and issues (FIN-97, same as in fin-assist/android and fin-assist/contracts): mention @claude in a comment or review (review requests, questions, fixes).
# Needs the Claude GitHub App on the repo and the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`).
# Comment-triggered workflows run from the default branch, so changes here take effect after merging to main.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pin Claude Opus 5.5 and keep high review effort explicit (AGENTS.md, Workflow; FIN-204).
          # Review findings go on diff lines as conversations (AGENTS.md); the action starts the inline-comment
          # tool only when it is allowed here.
          claude_args: '--model claude-opus-5-5 --effort high --allowedTools "mcp__github_inline_comment__create_inline_comment"'
